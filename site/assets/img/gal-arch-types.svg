<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Τύποι ποδικής καμάρας"><rect width="800" height="500" fill="#fafdfe"/><g transform="translate(62,10)">
  <text x="40" y="66" font-family="Manrope,Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="560" fill="#2a4b5a" text-anchor="start">Πώς αλλάζει η κατανομή του βάρους</text>
  <text x="40" y="96" font-family="Manrope,Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="420" fill="#6c8894" text-anchor="start">Όσο πέφτει η καμάρα, τόσο μετακινείται το φορτίο μπροστά και μέσα.</text>
  <g transform="translate(14,0)"><rect x="-4" y="150" width="212" height="230" rx="18" fill="#f1f8fa"/><path d="M16 300L76 300C104 300 108 234 134 234C158 234 160 300 184 300C196 300 197 268 190 246C182 216 168 202 140 200C110 198 84 216 62 244C46 264 30 284 16 300Z" fill="#fdf1e8" stroke="#e0c6b3" stroke-width="2"/><path d="M76 300C104 300 108 234 134 234C158 234 160 300 184 300" fill="none" stroke="#3b7387" stroke-width="4"/><path d="M4 306h196" stroke="#d3e3e9" stroke-width="5" stroke-linecap="round"/><circle cx="46" cy="300" r="6" fill="#d9a066"/><circle cx="184" cy="300" r="6" fill="#d9a066"/><text x="100" y="336" font-family="Manrope,Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="560" fill="#2a4b5a" text-anchor="middle">Κοίλος πους</text><text x="100" y="358" font-family="Manrope,Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="420" fill="#6c8894" text-anchor="middle">Ψηλή καμάρα · φορτίο σε δύο σημεία</text></g>
  <g transform="translate(224,0)"><rect x="-4" y="150" width="212" height="230" rx="18" fill="#f1f8fa"/><path d="M16 300L76 300C104 300 108 264 134 264C158 264 160 300 184 300C196 300 197 268 190 246C182 216 168 202 140 200C110 198 84 216 62 244C46 264 30 284 16 300Z" fill="#fdf1e8" stroke="#e0c6b3" stroke-width="2"/><path d="M76 300C104 300 108 264 134 264C158 264 160 300 184 300" fill="none" stroke="#3b7387" stroke-width="4"/><path d="M4 306h196" stroke="#d3e3e9" stroke-width="5" stroke-linecap="round"/><circle cx="46" cy="300" r="6" fill="#d9a066"/><circle cx="184" cy="300" r="6" fill="#d9a066"/><text x="100" y="336" font-family="Manrope,Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="560" fill="#2a4b5a" text-anchor="middle">Φυσιολογικό</text><text x="100" y="358" font-family="Manrope,Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="420" fill="#6c8894" text-anchor="middle">Ισορροπημένη κατανομή</text></g>
  <g transform="translate(434,0)"><rect x="-4" y="150" width="212" height="230" rx="18" fill="#f1f8fa"/><path d="M16 300L76 300C104 300 108 292 134 292C158 292 160 300 184 300C196 300 197 268 190 246C182 216 168 202 140 200C110 198 84 216 62 244C46 264 30 284 16 300Z" fill="#fdf1e8" stroke="#e0c6b3" stroke-width="2"/><path d="M76 300C104 300 108 292 134 292C158 292 160 300 184 300" fill="none" stroke="#3b7387" stroke-width="4"/><path d="M4 306h196" stroke="#d3e3e9" stroke-width="5" stroke-linecap="round"/><circle cx="46" cy="300" r="6" fill="#d9a066"/><circle cx="184" cy="300" r="6" fill="#d9a066"/><text x="100" y="336" font-family="Manrope,Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="560" fill="#2a4b5a" text-anchor="middle">Πλατυποδία</text><text x="100" y="358" font-family="Manrope,Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="420" fill="#6c8894" text-anchor="middle">Χαμηλή καμάρα · φορτίο προς τα μέσα</text></g>
  <text x="40" y="444" font-family="Manrope,Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="420" fill="#6c8894" text-anchor="start">Οι δύο κουκκίδες δείχνουν πού ακουμπά πραγματικά το πόδι στο έδαφος.</text>
</g></svg>